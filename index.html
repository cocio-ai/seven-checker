<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-Eleven Promo Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        :root {
            --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e; --text-sub: #8e8e93;
            --c-puraichi: #ff3b30; --c-app: #ff9500; --c-sale: #ff2d55; --c-other: #007aff; 
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 32px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 80px; }

        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .app-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        .app-title i { color: #00803E; margin-right: 6px; }
        
        .view-controls { display: flex; background: #e5e5ea; border-radius: 10px; padding: 3px; }
        .view-btn { border: none; background: transparent; color: var(--text-sub); padding: 8px 16px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .view-btn.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

        .dashboard { max-width: 1200px; margin: 24px auto 16px; padding: 0 20px; }
        .section-title { font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .region-selector { position: relative; margin-bottom: 16px; }
        .region-selector select {
            width: 100%; appearance: none; background: var(--card-bg); border: 1px solid rgba(0,0,0,0.08); border-radius: 14px;
            padding: 14px 40px 14px 16px; font-size: 16px; font-weight: 700; color: var(--text-main);
            box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.2s;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 16px center; background-size: 18px;
        }

        .new-product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .new-card {
            display: flex; flex-direction: column; justify-content: center; padding: 20px 16px;
            border-radius: 20px; text-decoration: none; color: white; transition: all 0.3s;
            box-shadow: var(--shadow-md); position: relative; overflow: hidden;
        }
        .new-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .new-card.this-week { background: linear-gradient(135deg, #34c759 0%, #28a745 100%); }
        .new-card.next-week { background: linear-gradient(135deg, #ff9500 0%, #ff8c00 100%); }
        .new-card i.main-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.9; }
        .new-card .sub-text { font-size: 11px; font-weight: 700; opacity: 0.8; letter-spacing: 0.5px; margin-bottom: 4px; }
        .new-card .main-text { font-size: 16px; font-weight: 800; }

        .filter-container { display: flex; gap: 8px; justify-content: flex-start; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { border: none; background: #e5e5ea; color: var(--text-sub); padding: 10px 18px; border-radius: 100px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-btn.active { background: #1c1c1e; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .campaign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.03); }
        .card-content { padding: 24px; flex-grow: 1; }
        
        .badges-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; color: white; letter-spacing: 0.5px;}
        .badge.puraichi { background: var(--c-puraichi); } .badge.app { background: var(--c-app); }
        .badge.sale { background: var(--c-sale); } .badge.other { background: var(--c-other); }
        .badge.region { background: #1c1c1e; color: #ffd60a; }

        .product-highlight { display: inline-flex; align-items: center; background: rgba(0, 122, 255, 0.08); color: var(--c-other); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; margin-bottom: 12px; width: 100%; border: 1px solid rgba(0, 122, 255, 0.1);}
        .card-title { font-size: 16px; font-weight: 800; margin: 0 0 12px 0; line-height: 1.5; color: var(--text-main); }
        .card-date { font-size: 13px; color: #ff3b30; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; }
        
        .card-footer { padding: 0 20px 20px; }
        .official-link { display: flex; justify-content: center; align-items: center; background: #f2f2f7; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 12px; transition: 0.2s; margin-bottom: 8px;}
        
        /* カレンダーボタンのスタイル */
        .calendar-actions { display: flex; gap: 8px; }
        .cal-btn { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; cursor: pointer; border: none;}
        .cal-btn.google { background: #e8f0fe; color: #1a73e8; }
        .cal-btn.apple { background: #fcebeb; color: #ff3b30; }

        #calendar-view { display: none; background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow-sm); }
        .fc-toolbar-title { font-size: 18px !important; font-weight: 800; }
        .fc-event { cursor: pointer; border: none; padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        
        .status-message { text-align: center; padding: 60px 20px; color: var(--text-sub); font-weight: 600; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(0,0,0,0.1); border-top-color: #00803E; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <h1 class="app-title"><i class="fa-solid fa-store"></i>7-11 Promo</h1>
            <div class="view-controls">
                <button id="btn-list" class="view-btn active" onclick="switchView('list')"><i class="fa-solid fa-list"></i></button>
                <button id="btn-cal" class="view-btn" onclick="switchView('calendar')"><i class="fa-regular fa-calendar-days"></i></button>
            </div>
        </div>
    </header>

    <div class="dashboard">
        <div class="section-title">エリアを選択</div>
        <div class="region-selector">
            <select id="region-select">
                <option value="all" selected>全国の情報を表示</option>
                <option value="hokkaido">北海道</option>
                <option value="tohoku">東北</option>
                <option value="kanto">関東</option>
                <option value="koshinetsu">甲信越・北陸</option>
                <option value="tokai">東海（愛知・岐阜・三重・静岡）</option>
                <option value="kinki">近畿</option>
                <option value="chugoku">中国・四国</option>
                <option value="kyushu">九州・沖縄</option>
            </select>
        </div>

        <div class="new-product-grid">
            <a href="https://www.sej.co.jp/products/a/thisweek/" target="_blank" rel="noopener noreferrer" id="link-this-week" class="new-card this-week">
                <i class="fa-solid fa-box-open main-icon"></i>
                <div class="sub-text" id="label-this">全国エリア</div>
                <div class="main-text">今週の新商品</div>
            </a>
            <a href="https://www.sej.co.jp/products/a/nextweek/" target="_blank" rel="noopener noreferrer" id="link-next-week" class="new-card next-week">
                <i class="fa-solid fa-truck-fast main-icon"></i>
                <div class="sub-text" id="label-next">全国エリア</div>
                <div class="main-text">来週の新商品</div>
            </a>
        </div>

        <div class="section-title" style="margin-top: 24px;">キャンペーン一覧</div>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="puraichi">🎁 プライチ</button>
            <button class="filter-btn" data-filter="app">📱 アプリ</button>
            <button class="filter-btn" data-filter="sale">🏷️ セール</button>
            <button class="filter-btn" data-filter="other">🌟 他</button>
        </div>
    </div>

    <main class="container">
        <div id="campaign-grid" class="campaign-grid"></div>
        <div id="calendar-view"></div>
        <div id="status-message" class="status-message">
            <div class="spinner"></div>
            データを同期中...
        </div>
    </main>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx3ulJwQE-54Kj7xrSiLFirjlrgIm53cfRNcbloxxwLarWLiCoDaznQk7fWGxcWVo-m/exec';

        const categoryColors = { puraichi: '#ff3b30', app: '#ff9500', sale: '#ff2d55', other: '#007aff' };
        const categories = {
            puraichi: { label: 'プライチ', class: 'puraichi' },
            app: { label: 'アプリ限定', class: 'app' },
            sale: { label: 'セール', class: 'sale' },
            other: { label: 'キャンペーン・他', class: 'other' }
        };

        const regionUrls = {
            all: { this: "https://www.sej.co.jp/products/a/thisweek/", next: "https://www.sej.co.jp/products/a/nextweek/" },
            hokkaido: { this: "https://www.sej.co.jp/products/a/thisweek/area/hokkaido/", next: "https://www.sej.co.jp/products/a/nextweek/area/hokkaido/" },
            tohoku: { this: "https://www.sej.co.jp/products/a/thisweek/area/tohoku/", next: "https://www.sej.co.jp/products/a/nextweek/area/tohoku/" },
            kanto: { this: "https://www.sej.co.jp/products/a/thisweek/area/kanto/", next: "https://www.sej.co.jp/products/a/nextweek/area/kanto/" },
            koshinetsu: { this: "https://www.sej.co.jp/products/a/thisweek/area/koshinetsu/", next: "https://www.sej.co.jp/products/a/nextweek/area/koshinetsu/" },
            tokai: { this: "https://www.sej.co.jp/products/a/thisweek/area/tokai/", next: "https://www.sej.co.jp/products/a/nextweek/area/tokai/" },
            kinki: { this: "https://www.sej.co.jp/products/a/thisweek/area/kinki/", next: "https://www.sej.co.jp/products/a/nextweek/area/kinki/" },
            chugoku: { this: "https://www.sej.co.jp/products/a/thisweek/area/chugoku/", next: "https://www.sej.co.jp/products/a/nextweek/area/chugoku/" },
            kyushu: { this: "https://www.sej.co.jp/products/a/thisweek/area/kyushu/", next: "https://www.sej.co.jp/products/a/nextweek/area/kyushu/" }
        };

        const regionKeywords = {
            all: [],
            hokkaido: ['北海道'], tohoku: ['東北', '青森', '岩手', '宮城', '秋田', '山形', '福島'],
            kanto: ['関東', '茨城', '栃木', '群馬', '埼玉', '千葉', '東京', '神奈川'],
            koshinetsu: ['甲信越', '北陸', '新潟', '富山', '石川', '福井', '山梨', '長野'],
            tokai: ['東海', '岐阜', '静岡', '愛知', '三重'],
            kinki: ['近畿', '関西', '滋賀', '京都', '大阪', '兵庫', '奈良', '和歌山'],
            chugoku: ['中国', '四国', '鳥取', '島根', '岡山', '広島', '山口', '徳島', '香川', '愛媛', '高知'],
            kyushu: ['九州', '沖縄', '福岡', '佐賀', '長崎', '熊本', '大分', '宮崎', '鹿児島']
        };

        let allCampaigns = []; 
        let currentFilter = 'all'; 
        let calendar; 

        const gridEl = document.getElementById('campaign-grid');
        const calEl = document.getElementById('calendar-view');
        const statusEl = document.getElementById('status-message');
        const regionSelect = document.getElementById('region-select');

        init();

        function init() {
            fetchData();
            updateDashboard(); 
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-filter');
                    if (calEl.style.display === 'block') renderCalendar();
                    else renderCampaigns();
                });
            });

            regionSelect.addEventListener('change', function() {
                updateDashboard();
                if (calEl.style.display === 'block') renderCalendar();
                else renderCampaigns(); 
            });
        }

        function updateDashboard() {
            try {
                const selectedRegion = regionSelect.value;
                const linkData = regionUrls[selectedRegion];
                let regionName = regionSelect.options[regionSelect.selectedIndex].text.split('（')[0];
                if (regionName === '全国の情報を表示') regionName = '全国';
                
                document.getElementById('link-this-week').href = linkData.this;
                document.getElementById('link-next-week').href = linkData.next;
                document.getElementById('label-this').innerText = regionName + (regionName === '全国' ? '' : 'エリア');
                document.getElementById('label-next').innerText = regionName + (regionName === '全国' ? '' : 'エリア');
            } catch (e) {}
        }

        function switchView(view) {
            document.getElementById('btn-list').classList.toggle('active', view === 'list');
            document.getElementById('btn-cal').classList.toggle('active', view === 'calendar');
            
            if (view === 'list') {
                calEl.style.display = 'none'; gridEl.style.display = 'grid'; renderCampaigns();
            } else {
                gridEl.style.display = 'none'; calEl.style.display = 'block'; renderCalendar();
            }
        }

        function extractProductName(text) {
            const matches = text.match(/「(.+?)」/g);
            return matches ? matches.map(m => m.replace(/[「」]/g, '')).join(' / ') : null;
        }

        async function fetchData() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                if (data.status === 'success' && data.data) {
                    allCampaigns = data.data;
                    statusEl.style.display = 'none';
                    renderCampaigns();
                } else {
                    statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="font-size:32px; margin-bottom:12px; display:block;"></i>データの取得に失敗しました。';
                }
            } catch (error) {
                statusEl.innerHTML = '<i class="fa-solid fa-wifi" style="font-size:32px; margin-bottom:12px; display:block;"></i>通信エラーが発生しました。';
            }
        }

        function getFilteredData() {
            let data = currentFilter === 'all' ? allCampaigns : allCampaigns.filter(item => item.category === currentFilter);
            const selectedRegion = regionSelect.value;
            if (selectedRegion !== 'all') {
                const keywords = regionKeywords[selectedRegion];
                data = data.filter(item => {
                    if (!item.region) return true;
                    return keywords.some(kw => item.region.includes(kw));
                });
            }
            return data;
        }

        function renderCalendar() {
            if (!calendar) {
                calendar = new FullCalendar.Calendar(calEl, {
                    initialView: 'dayGridMonth', locale: 'ja', height: 'auto',
                    headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
                    eventClick: function(info) { window.open(info.event.url, '_blank'); info.jsEvent.preventDefault(); }
                });
                calendar.render();
            }
            calendar.removeAllEvents();
            
            const filteredData = getFilteredData();
            filteredData.forEach(item => {
                if (item.startDate) { 
                    calendar.addEvent({
                        title: item.title, start: item.startDate, end: item.endDate,
                        url: item.url, backgroundColor: categoryColors[item.category] || categoryColors.other
                    });
                }
            });
        }

        // ==========================================
        // カレンダー用のデータを生成する機能（NEW!）
        // ==========================================
        function generateGoogleCalUrl(title, start, end, url) {
            const startStr = start.replace(/-/g, '');
            const endStr = end.replace(/-/g, '');
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startStr}/${endStr}&details=${encodeURIComponent(url)}`;
        }

        function downloadICS(title, start, end, url) {
            const startStr = start.replace(/-/g, '');
            const endStr = end.replace(/-/g, '');
            const icsData = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART;VALUE=DATE:${startStr}\nDTEND;VALUE=DATE:${endStr}\nSUMMARY:${title}\nURL:${url}\nEND:VEVENT\nEND:VCALENDAR`;
            
            // ファイルとしてダウンロードさせる処理（iPhoneではカレンダー追加画面が開きます）
            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', '711_promo.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderCampaigns() {
            gridEl.innerHTML = ''; 
            const filteredItems = getFilteredData();

            if (filteredItems.length === 0) {
                gridEl.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8e8e93; padding: 60px;"><i class="fa-solid fa-inbox" style="font-size:40px; margin-bottom:16px; opacity:0.3;"></i><br>このエリアに該当するキャンペーンはありません。</div>';
                return;
            }
            
            filteredItems.forEach((item, index) => {
                const catInfo = categories[item.category] || categories.other;
                const extractedProduct = extractProductName(item.title);
                const productHtml = extractedProduct ? `<div class="product-highlight"><i class="fa-solid fa-box-open"></i> ${extractedProduct}</div>` : '';
                const regionHtml = item.region ? `<span class="badge region"><i class="fa-solid fa-location-dot"></i> ${item.region}限定</span>` : '';

                // ★ カレンダーボタンの生成（期間データがある場合のみ表示）
                let calButtonsHtml = '';
                if (item.startDate && item.endDate) {
                    // Googleカレンダー用のリンクURL
                    const gCalUrl = generateGoogleCalUrl(item.title, item.startDate, item.endDate, item.url);
                    
                    calButtonsHtml = `
                        <div class="calendar-actions">
                            <a href="${gCalUrl}" target="_blank" class="cal-btn google">
                                <i class="fa-brands fa-google"></i> 追加
                            </a>
                            <button onclick="downloadICS('${item.title.replace(/'/g, "\\'")}', '${item.startDate}', '${item.endDate}', '${item.url}')" class="cal-btn apple">
                                <i class="fa-brands fa-apple"></i> 追加
                            </button>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-content">
                        <div class="badges-wrapper">
                            <span class="badge ${catInfo.class}">${catInfo.label}</span>
                            ${regionHtml}
                        </div>
                        ${productHtml}
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-date"><i class="fa-regular fa-clock"></i> ${item.date}</div>
                    </div>
                    <div class="card-footer">
                        <a href="${item.url}" target="_blank" class="official-link">詳細を見る <i class="fa-solid fa-chevron-right"></i></a>
                        ${calButtonsHtml}
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }
    </script>
</body>
</html>
